[package]
name = "graphy-blueprint"
version = "0.1.0"
edition = "2021"
authors = ["Pulsar Team"]
description = "GPUI-free authored Blueprint graph schema, codecs, legacy readers and library model"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
