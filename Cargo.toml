# Graphy workspace
#
# Dependency DAG (arrows point at dependencies). The first four crates are
# headless: none may depend on gpui or wgpu.
#
#   graphy            document/compiler IR, stable ids, graph invariants, type
#                     resolution, diagnostics, edit commands, analysis and codegen
#   graphy-blueprint  authored Blueprint asset schema, codecs, legacy readers,
#                     library and prefab models (leaf crate: serde, chrono, uuid)
#   graphy-reflection adapter from Pulsar runtime reflection (pulsar_reflection) to
#                     TypeResolver and NodeMetadata  ->  graphy, pulsar_reflection;
#                     the only crate that knows Pulsar, so graphy stays free of it
#
#   graphy-render     headless canvas model: the one layout model (rows with per-row
#                     heights), view transform, R-tree spatial index, hit testing,
#                     scene derived from GraphDescription, renderer-neutral draw data
#                     (culling, zoom-tier LOD, state hierarchy), presenter hooks
#                     ->  graphy
#   graphy-render-wgpu shared GPU drawing of `DrawData` into the HOST's device/queue
#                     and render pass (never creates a device); glyph atlas text
#                     ->  graphy-render, wgpu
#   graphy-gpui       interaction engine (selection, marquee, move/resize, snapping,
#                     connect/disconnect/reroute, clipboard, framing), the GraphProfile
#                     extension API and, behind feature `gpui`, the GPUI canvas
#                     ->  graphy, graphy-render (and graphy-render-wgpu, gpui)
#                     NOT a member of this workspace: the gpui feature needs Pulsar's
#                     wgpu/gpui forks, so it is its own workspace (crates/graphy-gpui)
#                     and Graphy's lockfile never resolves them.
#
# Compiler-only consumers (psgc, blueprint_compiler, pulsar_game) never pull the
# render or UI crates in.
[workspace]
members = [".", "crates/graphy-blueprint", "crates/graphy-reflection", "crates/graphy-render", "crates/graphy-render-wgpu"]
exclude = ["crates/graphy-gpui"]
resolver = "2"

[package]
name = "graphy"
version = "0.1.0"
edition = "2021"
authors = ["Pulsar Team"]
description = "General-purpose graph compilation library for node-based visual programming"
license = "MIT"

[dependencies]
# AST parsing and manipulation
syn = { version = "2.0", features = ["full", "visit", "visit-mut", "extra-traits"] }
quote = "1.0"

# Authored graph schema, for the canvas <-> authored bridge (authored.rs)
graphy-blueprint = { path = "crates/graphy-blueprint" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

# Error handling
thiserror = "1.0"

# Parallelism
rayon = "1.11"

# Fast hashing (non-cryptographic)
rustc-hash = "2.0"

# Stack-allocated vectors for small collections
smallvec = "1.13"

[dev-dependencies]
tracing-subscriber = "0.3"
criterion = { version = "0.5", features = ["html_reports"] }

# ====================
# PERFORMANCE PROFILES
# ====================

[profile.release]
# Maximum optimization level
opt-level = 3

# Link-Time Optimization - better cross-crate optimization
lto = "fat"

# Single codegen unit for maximum optimization (slower compile, faster runtime)
codegen-units = 1

# Abort on panic (smaller binary, slightly faster)
panic = "abort"

# Strip debug symbols from binary
strip = true

[profile.bench]
# Inherit release optimizations for benchmarks
inherits = "release"

[[bench]]
name = "graph_benchmarks"
harness = false

[[bench]]
name = "threadpool_bench"
harness = false
